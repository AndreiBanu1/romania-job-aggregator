@if (loading()) {
  <div class="state">
    <mat-spinner diameter="48"></mat-spinner>
    <p>Searching jobs...</p>
  </div>
} @else if (jobs().length === 0) {
  <div class="state">
    <mat-icon>inbox</mat-icon>
    <p>No results yet. Try a search above.</p>
  </div>
} @else {
  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Job Title</th>
        <td mat-cell *matCellDef="let job">{{ job.title }}</td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Company</th>
        <td mat-cell *matCellDef="let job">{{ job.company }}</td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
        <td mat-cell *matCellDef="let job">{{ job.location }}</td>
      </ng-container>

      <ng-container matColumnDef="source">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Source</th>
        <td mat-cell *matCellDef="let job">
          <mat-chip [disableRipple]="true">{{ job.source }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="href">
        <th mat-header-cell *matHeaderCellDef>URL</th>
        <td mat-cell *matCellDef="let job">
          <a [href]="job.href" target="_blank" rel="noopener">
            View <mat-icon class="link-icon">open_in_new</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[10, 25, 50, 100]"
      [pageSize]="25"
      showFirstLastButtons
    ></mat-paginator>
  </div>
}
