@if (loading()) {
    <div class="spinner">Searching...</div>
} @else if (jobs().length === 0) {
    <div class="no-results">No results found.</div>
} @else {
    <table>
        <thead>
            <tr>
                <th>Job Title</th>
                <th>Company</th>
                <th>Location</th>
                <th>Source</th>  
                <th>URL</th>  
            </tr>
        </thead>
        <tbody>
            @for (job of jobs(); track job.href) {
                <tr>
                    <td>{{ job.title }}</td>
                    <td>{{ job.company }}</td>
                    <td>{{ job.location }}</td>
                    <td>{{ job.source }}</td>
                    <td><a href="{{ job.href }}" target="_blank">View Job</a></td>
                </tr>
            }
        </tbody>
    </table>
}
